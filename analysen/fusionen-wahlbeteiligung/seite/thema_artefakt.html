<style>
/* Layout: eine Lesespalte wie ein Zeitungsartikel; Diagramme treten etwas breiter heraus, der Methodenteil liegt auf einer ruhigen Fläche. */
:root {
  --paper: #f7f8f6;
  --panel: #eef0ec;
  --ink: #161b19;
  --ink-2: #48514d;
  --ink-3: #6b736f;
  --rule: #d6dbd7;
  --accent: #1d5c63;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --band: rgba(42, 120, 214, 0.10);
  --font-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --step--1: 0.84rem;
  --step-0: 1.06rem;
  --step-1: 1.3rem;
  --step-2: 1.7rem;
  --step-3: clamp(2rem, 1.3rem + 3vw, 3.1rem);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131715; --panel: #1b201e; --ink: #ecefec; --ink-2: #b9c1bd; --ink-3: #8f9894; --rule: #2e3532;
    --accent: #6fb7bf; --series-1: #3987e5; --series-2: #d95926; --band: rgba(57, 135, 229, 0.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131715; --panel: #1b201e; --ink: #ecefec; --ink-2: #b9c1bd; --ink-3: #8f9894; --rule: #2e3532;
  --accent: #6fb7bf; --series-1: #3987e5; --series-2: #d95926; --band: rgba(57, 135, 229, 0.16);
  color-scheme: dark;
}
